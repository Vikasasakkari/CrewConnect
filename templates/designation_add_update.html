{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header">
                <h4 class="mb-0">{% if is_update %}Edit{% else %}Add{% endif %} Designation</h4>
            </div>
            <div class="card-body">
                <form method="post" novalidate>
                    {% csrf_token %}

                    <div class="mb-3">
                    <label class="form-label">
                        Designation ID
                    </label>
                    <input
                        type="text"
                        name="designation_id"
                        class="form-control"
                        placeholder="Enter designation ID"
                        value="{{ designation.id|default:'' }}"
                        required
                    >
                </div>

                    <div class="mb-3">
                    <label class="form-label">
                        Designation Name
                    </label>
                    <input
                        type="text"
                        name="designation_name"
                        class="form-control"
                        placeholder="Enter designation name"
                        value="{{ designation.name|default:'' }}"
                        required
                    >
                </div>

                    <div class="d-flex justify-content-between">
                        <a href="{% url 'designation_list' %}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
