{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-start mb-4">
    <div>
        <h1 class="h2 mb-1">Departments</h1>
        <p class="text-muted mb-0">Manage all CrewConnect departments</p>
    </div>

<a href="{% url 'department_create' %}" class="btn btn-primary">
    + Add Department
</a>


</div>

<div class="card shadow-sm border-0">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-bordered table-hover align-middle">


            <thead class="table-dark">
                <tr>
                    <th>Dept ID</th>
                    <th>Name</th>
                    <th class="text-end">Actions</th>
                </tr>
            </thead>

            <tbody>
                {% for dept in departments %}
                <tr>
                    <td>{{ dept.id }}</td>
                    <td class="fw-medium">{{ dept.name }}</td>

                    <td class="text-end">
                        <a href="{% url 'department_update' dept.id %}"
                           class="btn btn-sm btn-warning">
                            Edit
                        </a>

                        <a href="{% url 'department_delete' dept.id %}"
                           class="btn btn-sm btn-danger">
                            Delete
                        </a>
                    </td>
                </tr>

                {% empty %}
                <tr>
                    <td colspan="3" class="text-center text-muted py-4">
                        No departments found.
                    </td>
                </tr>
                {% endfor %}
            </tbody>

        </table>
    </div>
</div>

</div>

{% endblock %}
